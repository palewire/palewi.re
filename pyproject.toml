[project]
name = "palewi-re"
version = "0.1.0"
description = "palewi.re — Ben Welsh's personal site"
requires-python = ">=3.12"
dependencies = [
    "Django~=5.2",
    "beautifulsoup4>=4.13",
    "Pygments>=2.19",
    "tzdata>=2025.1",
    "markdown>=3.7",
    "pyyaml>=6.0",
    "django-bakery==0.14.0",
]

[dependency-groups]
dev = [
    "click>=8.1",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=6.1",
    "coverage[toml]>=7.8",
    "ruff>=0.14",
    "savepagenow>=1.3.1",
    "ty>=0.0.10",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP031"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["coltrane", "project", "scripts", "toolbox"]
omit = [
    "*/migrations/*",
    "*/staticfiles/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true

[tool.ty]
# Django uses dynamic attributes (such as ``.objects``) that ty cannot resolve
# in every case. Treat the known framework gaps as errors too, so the check
# cannot pass with diagnostics.
[tool.ty.rules]
unresolved-attribute = "error"
invalid-argument-type = "error"
invalid-assignment = "error"
invalid-method-override = "error"
no-matching-overload = "error"
unresolved-import = "error"
