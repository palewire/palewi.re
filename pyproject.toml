[project]
name = "palewi-re"
version = "0.1.0"
description = "palewi.re — Ben Welsh's personal site"
requires-python = ">=3.12"
dependencies = [
    "Django~=5.2",
    "django-sass-processor>=1.4",
    "django-proxy>=1.2",
    "libsass>=0.23",
    "gunicorn>=23.0",
    "whitenoise[brotli]>=6.9",
    "beautifulsoup4>=4.13",
    "Pygments>=2.19",
    "tzdata>=2025.1",
    "markdown>=3.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "click>=8.1",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-django>=4.11",
    "pytest-cov>=6.1",
    "coverage[toml]>=7.8",
    "ruff>=0.14",
    "ty>=0.0.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "UP031"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=40"

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/staticfiles/*",
    "manage.py",
    "wsgi.py",
]

[tool.coverage.report]
show_missing = true

[tool.ty]
# Django uses many dynamic attributes (get_FOO_display, .objects, etc.) that
# ty cannot statically resolve. We treat those categories as warnings rather
# than errors so ty still catches real new mistakes in our own code.
[tool.ty.rules]
unresolved-attribute = "warn"
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-method-override = "warn"
no-matching-overload = "warn"
unresolved-import = "warn"
