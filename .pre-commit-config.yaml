# See https://pre-commit.com for more information
exclude: ^coltrane/content/posts/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^workers/(mastodon-well-known-proxy|legacy-redirects)/worker-configuration\.d\.ts$
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-json
      - id: forbid-submodules
      - id: end-of-file-fixer
      - id: debug-statements
      - id: check-ast

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: env UV_NO_ENV_FILE=1 uv run ruff check --fix
        types: [python]
      - id: ruff-format
        name: ruff format
        language: system
        entry: env UV_NO_ENV_FILE=1 uv run ruff format
        types: [python]
      - id: ty
        name: ty (static type analysis)
        language: system
        entry: env UV_NO_ENV_FILE=1 uv run ty check --exit-zero-on-warning
        types: [python]
        pass_filenames: false
