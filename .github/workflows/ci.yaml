name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: make install

      - name: Check with Ruff
        run: make lint

      - name: Type check with ty
        run: make typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: palewire
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/palewire
      SECRET_KEY: ci-test-secret-key
      DEBUG: "true"
      UV_NO_ENV_FILE: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make bootstrap

      - name: Check migration drift
        run: make migrations-check

      - name: Django system check
        run: make django-check

      - name: Build production static files
        env:
          PRODUCTION: "true"
          SECURE_SSL_REDIRECT: "false"
          SECRET_KEY: ci-static-build-secret-with-more-than-fifty-characters
        run: |
          uv run python manage.py compilescss --verbosity 0
          uv run python manage.py collectstatic --noinput --clear
          grep -q '"styles.css"' collected_static/staticfiles.json

      - name: Run tests
        run: make test
