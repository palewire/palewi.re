name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dev dependencies
        run: make install

      - name: Check with Ruff
        run: make lint

      - name: Type check with ty
        run: make typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "true"
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: make ci-bootstrap

      - name: Django system check
        run: make django-check

      - name: Build production static files
        env:
          PRODUCTION: "true"
          SECURE_SSL_REDIRECT: "false"
          SECRET_KEY: ci-static-build-secret-with-more-than-fifty-characters
        run: |
          make css
          uv run python manage.py collectstatic --noinput --clear
          grep -q '"styles.css"' collected_static/staticfiles.json

      - name: Run tests
        run: make test

      - name: Run Worker tests and validation
        run: |
          make worker-test
          make legacy-worker-test
          make worker-validate
          make legacy-worker-validate
