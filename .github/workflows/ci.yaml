name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dev dependencies
        run: make install

      - name: Verify changelog label
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          category_count="$(
            jq '[
              any(.[]; . == "feature"),
              any(.[]; . == "improvement" or . == "enhancement"),
              any(.[]; . == "fix"),
              any(.[]; . == "maintenance" or . == "dependencies" or . == "github_actions"),
              any(.[]; . == "skip-changelog")
            ] | map(select(.)) | length' <<< "$PR_LABELS"
          )"
          test "$category_count" -eq 1 || {
            echo "Apply exactly one changelog category: feature, improvement, fix, maintenance, or skip-changelog." >&2
            exit 1
          }

      - name: Check with Ruff
        run: make lint

      - name: Type check with ty
        run: make typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "true"
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: make ci-bootstrap

      - name: Django system check
        run: make django-check

      - name: Review preservation for new external content
        run: make preservation-review

      - name: Build production static files
        env:
          STATIC_MANIFEST: "true"
        run: |
          uv run python manage.py collectstatic --noinput --clear
          grep -q '"styles.css"' collected_static/staticfiles.json

      - name: Run tests
        run: make test

      - name: Validate built-site content and Workers
        run: |
          make static-worker-test
          make static-worker-validate
          make worker-test
          make legacy-worker-test
          make worker-validate
          make legacy-worker-validate

  deploy-static-site:
    name: Deploy site and redirects
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UV_NO_ENV_FILE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Bootstrap deployment
        run: make ci-bootstrap

      - name: Deploy legacy redirect canary
        run: |
          CONFIRM_LEGACY_WORKER_SAME_ZONE_CANARY_DEPLOY=1 make legacy-worker-same-zone-canary-deploy
          CONFIRM_LEGACY_WORKER_ATTACH_SAME_ZONE_CANARY=1 make legacy-worker-attach-same-zone-canary

      - name: Verify legacy redirect canary
        run: make legacy-worker-verify-same-zone-canary

      - name: Delete legacy redirect canary
        if: always()
        run: CONFIRM_LEGACY_WORKER_DELETE_SAME_ZONE_CANARY=1 make legacy-worker-delete-same-zone-canary

      - name: Build and deploy static site
        run: |
          make bake
          npm --prefix workers/static-site ci --ignore-scripts --no-audit --no-fund
          cd workers/static-site
          npm exec -- wrangler deploy --env="" --strict

      - name: Deploy legacy redirect routes
        run: CONFIRM_LEGACY_WORKER_ATTACH_ROUTES=1 make legacy-worker-attach-routes

      - name: Verify site and Workers
        run: |
          scripts/verify-static-site.sh
          scripts/verify-worker-endpoints.sh
          scripts/verify-legacy-redirects.sh
          scripts/verify-legacy-domains.sh
