name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Makefile
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - Makefile
      - pyproject.toml
      - uv.lock

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"

      - name: Install Heroku CLI
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location https://cli-assets.heroku.com/install.sh | bash
          heroku version

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: |
          npm install --global --no-audit --no-fund wrangler@4.125.0
          wrangler --version

      - name: Configure development environment
        run: |
          echo "SECRET_KEY=copilot-setup-key" >> "$GITHUB_ENV"
          echo "UV_NO_ENV_FILE=1" >> "$GITHUB_ENV"

      - name: Bootstrap development environment
        run: make bootstrap
