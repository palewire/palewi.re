name: Smoke test

# Automatic: fires after Heroku reports a successful production deployment.
# Manual: run via Actions UI with an optional URL override.
on:
  deployment_status:
  repository_dispatch:
    types: [heroku_deploy]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke-test (default: https://palewi.re)"
        required: false
        default: "https://palewi.re"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test production
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'palewire')
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://palewi.re' }}

    steps:
      - name: Health check (with retries)
        run: |
          echo "Testing health endpoint: $BASE_URL/health/"
          for i in 1 2 3; do
            response=$(curl --silent --max-time 20 --write-out "\n%{http_code}" "$BASE_URL/health/" || true)
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -1)
            echo "Attempt $i — HTTP $http_code — $body"
            if [ "$http_code" = "200" ]; then
              if echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'; assert d['db'] is True" 2>/dev/null; then
                echo "✅ Health check passed"
                break
              fi
            fi
            if [ "$i" -lt 3 ]; then sleep 30; fi
          done
          if [ "$http_code" != "200" ]; then
            echo "❌ Health check failed after retries (last HTTP $http_code)"
            exit 1
          fi

      - name: Bio page
        run: |
          echo "Testing bio page: $BASE_URL/who-is-ben-welsh/"
          code=$(curl --silent --max-time 20 -o /dev/null -w "%{http_code}" "$BASE_URL/who-is-ben-welsh/")
          echo "HTTP $code"
          [ "$code" = "200" ] && echo "✅ Bio page OK" || { echo "❌ Bio page returned HTTP $code"; exit 1; }

      - name: Root redirect
        run: |
          echo "Testing root redirect: $BASE_URL/"
          code=$(curl --silent --max-time 20 -o /dev/null -w "%{http_code}" "$BASE_URL/")
          echo "HTTP $code"
          { [ "$code" = "301" ] || [ "$code" = "302" ]; } && echo "✅ Root redirect OK" || { echo "❌ Root did not redirect (HTTP $code)"; exit 1; }
