name: Smoke test

# Triggered automatically by Heroku's "Deploy Hooks" (send a
# repository_dispatch with event-type "heroku_deploy") or manually.
# Does NOT use a long-lived Heroku API token — only the public HTTPS URL
# of the live app is required.
on:
  repository_dispatch:
    types: [heroku_deploy]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke-test (default: https://palewi.re)"
        required: false
        default: "https://palewi.re"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://palewi.re' }}

    steps:
      - name: Health check
        run: |
          echo "Testing health endpoint: $BASE_URL/health/"
          response=$(curl --silent --max-time 15 --write-out "\n%{http_code}" "$BASE_URL/health/")
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -1)
          echo "HTTP $http_code — $body"
          if [ "$http_code" != "200" ]; then
            echo "❌ Health check failed (HTTP $http_code)"
            exit 1
          fi
          if ! echo "$body" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'; assert d['db'] is True"; then
            echo "❌ Health check body unexpected: $body"
            exit 1
          fi
          echo "✅ Health check passed"

      - name: Bio page
        run: |
          echo "Testing bio page: $BASE_URL/who-is-ben-welsh/"
          code=$(curl --silent --max-time 15 -o /dev/null -w "%{http_code}" "$BASE_URL/who-is-ben-welsh/")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "❌ Bio page returned HTTP $code"
            exit 1
          fi
          echo "✅ Bio page OK"

      - name: Root redirect
        run: |
          echo "Testing root redirect: $BASE_URL/"
          code=$(curl --silent --max-time 15 -o /dev/null -w "%{http_code}" "$BASE_URL/")
          echo "HTTP $code"
          if [ "$code" != "301" ] && [ "$code" != "302" ]; then
            echo "❌ Root did not redirect (HTTP $code)"
            exit 1
          fi
          echo "✅ Root redirect OK"
