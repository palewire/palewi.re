changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
    - title: Improvements
      labels:
        - improvement
        - enhancement
    - title: Fixes
      labels:
        - fix
    - title: Maintenance
      labels:
        - maintenance
        - dependencies
        - github_actions
    - title: Other changes
      labels:
        - "*"
