version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      django:
        patterns: ["django*", "dj-*"]
      testing:
        patterns: ["pytest*", "coverage*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      sass:
        patterns: ["sass"]

  - package-ecosystem: "npm"
    directory: "/workers/mastodon-well-known-proxy"
    schedule:
      interval: "weekly"
    groups:
      worker-tooling:
        patterns: ["wrangler", "typescript", "vitest", "@types/node"]

  - package-ecosystem: "npm"
    directory: "/workers/legacy-redirects"
    schedule:
      interval: "weekly"
    groups:
      worker-tooling:
        patterns: ["wrangler", "typescript", "vitest", "@types/node"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
