version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      django:
        patterns: ["django*", "dj-*"]
      testing:
        patterns: ["pytest*", "coverage*"]

  - package-ecosystem: "npm"
    directory: "/workers/mastodon-well-known-proxy"
    schedule:
      interval: "weekly"
    groups:
      worker-tooling:
        patterns: ["cf", "@cloudflare/vite-plugin", "vite", "typescript", "vitest", "@types/node"]

  - package-ecosystem: "npm"
    directory: "/workers/legacy-redirects"
    schedule:
      interval: "weekly"
    groups:
      worker-tooling:
        patterns: ["cf", "@cloudflare/vite-plugin", "vite", "typescript", "vitest", "@types/node"]

  - package-ecosystem: "npm"
    directory: "/workers/static-site"
    schedule:
      interval: "weekly"
    groups:
      worker-tooling:
        patterns: ["cf", "@cloudflare/vite-plugin", "vite", "typescript", "vitest", "@types/node", "esbuild", "miniflare"]

  - package-ecosystem: "npm"
    directory: "/talks"
    schedule:
      interval: "weekly"
    groups:
      talk-tooling:
        patterns: ["reveal.js"]

  - package-ecosystem: "npm"
    directory: "/tools/accessibility"
    schedule:
      interval: "weekly"
    groups:
      accessibility-tooling:
        patterns: ["pa11y-ci"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
