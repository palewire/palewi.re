<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lead art frame</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 2000px;
        height: 1250px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        background: transparent;
      }

      .browser {
        width: 2000px;
        height: 1110px;
        overflow: hidden;
        border: 1px solid #c9cbd0;
        border-radius: 24px;
        background: #fff;
        box-shadow:
          0 32px 80px rgb(31 35 41 / 18%),
          0 8px 24px rgb(31 35 41 / 10%);
      }

      .toolbar {
        display: grid;
        grid-template-columns: 132px 1fr 132px;
        align-items: center;
        height: 88px;
        padding: 0 28px;
        border-bottom: 1px solid #d7d9dd;
        background: #e9eaed;
      }

      .controls {
        display: flex;
        gap: 16px;
      }

      .control {
        width: 20px;
        height: 20px;
        border: 1px solid rgb(0 0 0 / 12%);
        border-radius: 50%;
      }

      .control.close {
        background: #ff5f57;
      }

      .control.minimize {
        background: #febc2e;
      }

      .control.maximize {
        background: #28c840;
      }

      .address {
        min-width: 0;
        height: 52px;
        padding: 0 24px;
        overflow: hidden;
        border: 1px solid #d2d4d8;
        border-radius: 13px;
        background: #f8f8f9;
        color: #50545b;
        font-size: 22px;
        line-height: 50px;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .viewport,
      .viewport img {
        width: 2000px;
        height: 1022px;
      }

      .viewport {
        object-fit: cover;
        object-position: top left;
        background: #fff;
      }

      .viewport img {
        display: block;
        object-fit: cover;
        object-position: top left;
      }

      .status {
        position: fixed;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="browser" aria-label="Browser-framed webpage screenshot">
      <header class="toolbar">
        <div class="controls" aria-hidden="true">
          <span class="control close"></span>
          <span class="control minimize"></span>
          <span class="control maximize"></span>
        </div>
        <div class="address" id="address"></div>
        <div></div>
      </header>
      <div class="viewport" id="viewport"></div>
    </main>
    <p class="status" id="status" role="status">Loading</p>
    <script>
      const params = new URLSearchParams(window.location.search);
      const sourceUrl = params.get("url");
      const address = document.querySelector("#address");
      const viewport = document.querySelector("#viewport");
      const status = document.querySelector("#status");

      try {
        const parsedUrl = new URL(sourceUrl);
        address.textContent = parsedUrl.hostname + parsedUrl.pathname;
      } catch {
        address.textContent = sourceUrl || "";
      }

      const capture = document.createElement("img");
      capture.alt = "";
      capture.addEventListener("load", () => {
        status.textContent = "Ready";
        document.title = "Ready";
      });
      capture.addEventListener("error", () => {
        status.textContent = "Image failed to load";
        document.title = "Image failed to load";
      });
      capture.src = "../../../.lead-art/source.png";
      viewport.appendChild(capture);
    </script>
  </body>
</html>
